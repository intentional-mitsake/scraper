name: Scrape and Update

on:
  schedule:
    - cron: "0 0 */3 * *"   # every 3 days at 00:00 UTC
  workflow_dispatch:         # allows to also run it manually from the Actions tab

permissions:
  contents: write            # perm to write to the repo and commit

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r application/requirements.txt

      - name: Run scraper
        working-directory: application # to access jsons folder
        run: python autoUpdate.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add application/jsons/
          git diff --staged --quiet || (git commit -m "Update data $(date -u +%F)" && git push)